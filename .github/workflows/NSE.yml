name: Daily AI Scan & Telegram Notify

on:
  schedule:
    # Run at 9:30 AM IST (04:00 UTC) Monday-Friday
    - cron: '30 3 * * 1-5'
  workflow_dispatch: # Allows manual run

permissions:
  contents: write

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance numpy scikit-learn requests Jinja2

      - name: Train AI Model
        run: |
          python train_model.py

      - name: Run Headless Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python headless_scanner.py
          python update_html.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add active_trades.csv completed_trades.csv index.html ai_brain.pkl.gz || echo "No files found"
          git commit -m "Automated Daily Database & Model Update [skip ci]" || echo "No changes to commit"
          git push
